# Standalone production stack for aaPanel / VPS.
# Run from WebinoDashboard directory:
#   cp .env.docker.example .env
#   cp backend/.env.example backend/.env   # then edit + set APP_KEY
#   docker compose -f docker-compose.aapanel.yml up -d --build

name: webino-dashboard

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webino_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-webino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webino} -d ${POSTGRES_DB:-webino_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webino

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webino

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.platform
    image: webino-dashboard-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "1"
      RUN_OPTIMIZE: "1"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080
    networks:
      - webino

  worker:
    image: webino-dashboard-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - webino

  scheduler:
    image: webino-dashboard-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
    command: php artisan schedule:work
    networks:
      - webino

  frontend:
    build:
      context: ..
      dockerfile: WebinoDashboard/docker/next/Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    image: webino-dashboard-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AUTH_COOKIE_NAME: webino_auth_token
    depends_on:
      - backend
    networks:
      - webino

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - webino

networks:
  webino:
    driver: bridge

volumes:
  db_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
