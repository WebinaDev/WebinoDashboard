# Global edge proxy — only process that binds host :80 / :443
# Network webino-edge must exist (init-host.sh creates it).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true
    name: webino-edge

volumes:
  caddy_data:
  caddy_config:
