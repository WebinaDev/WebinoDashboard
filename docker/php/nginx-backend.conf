# Backend HTTP front for php-fpm (replaces single-threaded `php artisan serve`). Listens on :8080 like before.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 64m;
  client_body_temp_path /tmp/nginx-body;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  proxy_temp_path /tmp/nginx-proxy;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;
  server {
    listen 8080 default_server;
    root /var/www/html/public;
    index index.php;
    location ~* ^/storage/.+\.(?:jpe?g|png|webp|avif|gif|svg|woff2?|css|js)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri /index.php?$query_string;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $realpath_root;
      fastcgi_read_timeout 300;
      fastcgi_buffers 16 32k;
      fastcgi_buffer_size 64k;
    }
    location ~ /\.(?!well-known) { deny all; }
  }
}
