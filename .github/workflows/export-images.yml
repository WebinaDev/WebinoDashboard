name: Export release images
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of a built release
        required: true
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export image
        env:
          REVISION: ${{ inputs.revision }}
          SERVICE: ${{ matrix.service }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          image="ghcr.io/webinadev/webino-dashboard-$SERVICE:$REVISION"
          docker pull --platform=linux/amd64 "$image"
          docker save "$image" | gzip -1 > "$SERVICE.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz
          compression-level: 0
          retention-days: 1
