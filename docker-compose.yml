# WebinoDashboard — Architecture §13 service names.
# Only `web` publishes host ports. Run ./install.sh before compose up.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webino_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-webino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webino}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webino} -d ${POSTGRES_DB:-webino_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webino_dashboard

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-webino}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-webino}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webino_dashboard

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webino}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - webino_dashboard

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webino}
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - webino_dashboard

  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webino_dashboard}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webino}
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan schedule:work
    networks:
      - webino_dashboard

  frontend:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AUTH_COOKIE_NAME: webino_auth_token
    depends_on:
      - backend
    networks:
      - webino_dashboard

  web:
    image: caddy:2-alpine
    ports:
      - "${WEB_HTTP_PORT:-3080}:80"
      - "${WEB_HTTPS_PORT:-3443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    networks:
      - webino_dashboard

  docs:
    profiles: ["docs", "dev"]
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    networks:
      - webino_dashboard

networks:
  webino_dashboard:
    driver: bridge

volumes:
  redis_data:
  db_data:
