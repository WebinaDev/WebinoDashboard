# Production overlay for aaPanel / VPS deployment.
# Usage:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.platform
    image: webino-dashboard-backend:prod
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "1"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.platform
    image: webino-dashboard-backend:prod
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "0"
      QUEUE_CONNECTION: redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.platform
    image: webino-dashboard-backend:prod
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "0"
      QUEUE_CONNECTION: redis

  frontend:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    image: webino-dashboard-frontend:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AUTH_COOKIE_NAME: webino_auth_token

  web:
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  backend_storage:
